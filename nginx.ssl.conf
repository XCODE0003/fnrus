#=========================================================================#
# Default Web Domain Template                                             #
# DO NOT MODIFY THIS FILE! CHANGES WILL BE LOST WHEN REBUILDING DOMAINS   #
# https://hestiacp.com/docs/server-administration/web-templates.html      #
#=========================================================================#

server {
	listen      80.240.21.211:443 ssl;
	server_name fnrus.com www.fnrus.com;
	error_log   /var/log/apache2/domains/fnrus.com.error.log error;

	ssl_certificate     /home/admin/conf/web/fnrus.com/ssl/fnrus.com.pem;
	ssl_certificate_key /home/admin/conf/web/fnrus.com/ssl/fnrus.com.key;
	ssl_stapling        on;
	ssl_stapling_verify on;

	# TLS 1.3 0-RTT anti-replay
	if ($anti_replay = 307) { return 307 https://$host$request_uri; }
	if ($anti_replay = 425) { return 425; }

	include /home/admin/conf/web/fnrus.com/nginx.hsts.conf*;

	# Security headers (defence-in-depth — app also emits these via SecurityHeaders middleware).
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
	add_header X-Frame-Options            "DENY" always;
	add_header X-Content-Type-Options     "nosniff" always;
	add_header X-XSS-Protection           "1; mode=block" always;
	add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

	# Block dotfiles and source/backup leaks.
	location ~ /\.(?!well-known\/|file) {
		deny all;
		return 404;
	}
	location ~* \.(bak|backup|swp|orig|old|sql|sql\.gz|tar|tar\.gz|tgz|zip|env|ini|log|inc|sh|conf|dist|sample|example)$ {
		deny all;
		return 404;
	}
	location ~* /(?:vendor|storage|node_modules)/ {
		deny all;
		return 404;
	}

	# Block predictable admin paths at the edge (defence-in-depth — app also 404s these).
	location ~* ^/(wp-admin|wp-login|wp-login\.php|administrator|phpmyadmin|pma|manager|cms|backend|control|console|admin\.php) {
		return 404;
	}

	location / {
		
		limit_req zone=one burst=5 nodelay;
	    limit_req_status 429;

		proxy_pass https://80.240.21.211:8443;

		location ~* ^.+\.(css|htm|html|js|json|xml|apng|avif|bmp|cur|gif|ico|jfif|jpg|jpeg|pjp|pjpeg|png|svg|tif|tiff|webp|aac|caf|flac|m4a|midi|mp3|ogg|opus|wav|3gp|av1|avi|m4v|mkv|mov|mpg|mpeg|mp4|mp4v|webm|otf|ttf|woff|woff2|doc|docx|odf|odp|ods|odt|pdf|ppt|pptx|rtf|txt|xls|xlsx|7z|bz2|gz|rar|tar|tgz|zip|apk|appx|bin|dmg|exe|img|iso|jar|msi)$ {
			try_files  $uri @fallback;

			root       /home/admin/web/fnrus.com/public_html/public;
			access_log /var/log/apache2/domains/fnrus.com.log combined;
			access_log /var/log/apache2/domains/fnrus.com.bytes bytes;

			expires    max;
		}
	}

	location @fallback {
		proxy_pass https://80.240.21.211:8443;
	}

	location /error/ {
		alias /home/admin/web/fnrus.com/document_errors/;
	}

	proxy_hide_header Upgrade;

	include /home/admin/conf/web/fnrus.com/nginx.ssl.conf_*;
}
