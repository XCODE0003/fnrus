; Raise upload limits so large cover/hero images (4-10 MB) don't 500 the
; admin on save. Read by PHP-FPM/CGI from the docroot of the running script.
; (For mod_php hosts these must instead go in php.ini / .htaccess php_value.)
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
